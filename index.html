<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="tailwind.css">

    <style>
        :root { --bg-dark: #0a0b0d; --card-dark: #14161a; --pink-neon: #ffb7c5; --pink-glow: rgba(255, 183, 197, 0.3); }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-dark); color: #ffffff; overflow-x: hidden; }
        input, textarea { color: #fff; }
        .border-critica { border-left: 6px solid #ef4444 !important; }
        .border-media { border-left: 6px solid #f59e0b !important; }
        .border-planeada { border-left: 6px solid #10b981 !important; }
        .urg-btn-active { background: rgba(255, 255, 255, 0.1); border-color: white !important; transform: scale(1.05); }
        .nav-top { background: rgba(10, 11, 13, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 100; }
        .nav-btn { color: #64748b; font-size: 0.9rem; letter-spacing: 0.12em; font-weight: 700; transition: all 0.3s; }
        .nav-btn.active { color: var(--pink-neon); text-shadow: 0 0 10px var(--pink-glow); }
        .card-main { background: var(--card-dark); border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.03); }
        .tab-content { display: none; animation: fadeInUp 0.5s ease forwards; }
        .tab-content.active { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #chat-bubble { position: fixed; bottom: 2rem; right: 2rem; }
        #chat-widget { position: fixed; bottom: 110px; right: 30px; width: 380px; height: min(550px, 70vh); z-index: 120; display: none; flex-direction: column; }
        .pink-btn { background: var(--pink-neon); color: #000; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .pink-btn:disabled { opacity: 0.5; cursor: wait; }
        .tech-layer { pointer-events: none; mix-blend-mode: multiply; transition: opacity 0.4s ease; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .hotspot { position: absolute; width: 22px; height: 22px; background: var(--pink-neon); border-radius: 50%; cursor: pointer; z-index: 60; transform: translate(-50%, -50%); animation: pulse 2s infinite; border: 2px solid white; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,183,197,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,183,197,0); } 100% { box-shadow: 0 0 0 0 rgba(255,183,197,0); } }
        @media (max-width: 768px) {
            #nav-items { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(17, 17, 17, 0.95); display: flex; justify-content: space-around; gap: 0.25rem !important; padding: 1.1rem 0.5rem; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.08); }
            .nav-btn { font-size: 0.7rem; letter-spacing: 0.06em; }
            #chat-bubble { bottom: 88px; right: 16px; width: 3.5rem; height: 3.5rem; }
            #chat-widget { width: calc(100% - 32px) !important; right: 16px !important; bottom: 156px !important; height: min(480px, 60vh); }
        }
    </style>
</head>

    <script>
        // A chave "anon" é pública por natureza. A proteção dos dados é feita
        // pelas regras de segurança (RLS) do Supabase — ver supabase-seguranca.sql.
        const SUPA_URL = "https://kasrpxzqniumebjnrdmg.supabase.co";
        const SUPA_KEY = "sb_publishable_F4g1MLofOwh5jPe0BRvOqQ_almmNo1L";
        const BUCKET = 'obra-uploads';
        const AVATAR_PADRAO = 'https://ui-avatars.com/api/?background=ffb7c5&color=000&name=U';
        const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        let userState = { id: null, email: '', role: 'CLIENTE', avatar: null };
        let appIniciado = false;
        let urgenciaSelecionada = 'planeada';
        let pedidoParaAprovar = null;
        let arquivoCupom = null;
        let arquivoDiario = null;
        let cache = { hotspots: [], cronograma: [], pedidos: [], financeiro: [] };

        // --- SEGURANÇA: escapar todo texto vindo do banco antes de pôr na página ---
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        // Só aceita links https ou imagens/PDF embutidos (dados antigos em base64)
        function urlSegura(u) {
            u = String(u || '');
            return (/^https:\/\//i.test(u) || /^data:(image\/[a-z+.-]+|application\/pdf);base64,/i.test(u)) ? u : '';
        }
        function emailCurto(e) { return String(e || '').split('@')[0]; }
        function dataBR(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : ''; }
        function moeda(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function ocupado(btnId, sim) { const b = document.getElementById(btnId); if (b) b.disabled = sim; }

        async function uploadArquivo(file, pasta) {
            if (file.size > 10 * 1024 * 1024) throw new Error('Arquivo maior que 10 MB.');
            const ext = ((file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'bin';
            const caminho = `${pasta}/${crypto.randomUUID()}.${ext}`;
            const { error } = await sb.storage.from(BUCKET).upload(caminho, file, { contentType: file.type || undefined });
            if (error) throw error;
            return sb.storage.from(BUCKET).getPublicUrl(caminho).data.publicUrl;
        }

        // Abre anexos (inclui os antigos salvos em base64, que o navegador não abre direto)
        async function abrirAnexo(url) {
            url = urlSegura(url);
            if (!url) return;
            if (url.startsWith('data:')) {
                const blob = await (await fetch(url)).blob();
                window.open(URL.createObjectURL(blob), '_blank');
            } else {
                window.open(url, '_blank', 'noopener');
            }
        }

        // --- AUTH (Supabase Auth de verdade) ---
        function mostrarErroLogin(msg) {
            const p = document.getElementById('login-erro');
            p.innerText = msg; p.classList.toggle('hidden', !msg);
        }

        async function realizarLogin() {
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;
            if (!email || !pass) return mostrarErroLogin('Informe e-mail e senha.');
            mostrarErroLogin('');
            ocupado('btn-login', true);
            const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
            ocupado('btn-login', false);
            if (error) return mostrarErroLogin(error.message.includes('Invalid login') ? 'E-mail ou senha incorretos.' : 'Erro: ' + error.message);
            document.getElementById('login-pass').value = '';
            await iniciarSessao(data.user);
        }

        async function esqueciSenha() {
            const email = prompt("Digite seu e-mail para recuperação:");
            if (email) {
                const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin });
                if (error) alert("Erro: " + error.message);
                else alert("Se o e-mail estiver cadastrado, você receberá o link de recuperação.");
            }
        }

        async function atualizarSenha() {
            const nova = document.getElementById('nova-senha-input').value;
            if (nova.length < 8) return alert("A senha deve ter no mínimo 8 caracteres.");
            const { error } = await sb.auth.updateUser({ password: nova });
            if (error) alert("Erro ao atualizar: " + error.message);
            else {
                alert("Senha atualizada com sucesso!");
                document.getElementById('nova-senha-input').value = '';
                document.getElementById('label-seguranca').innerText = 'Segurança';
            }
        }

        async function iniciarSessao(user) {
            if (appIniciado || !user) return;
            appIniciado = true;
            localStorage.removeItem('gp_obra_session'); // sessão falsa da versão antiga
            userState.id = user.id;
            userState.email = (user.email || '').toLowerCase();
            const { data: perfil } = await sb.from('perfis').select('papel, avatar_url').eq('id', user.id).maybeSingle();
            // O papel aqui só controla o que aparece na tela. Quem realmente
            // bloqueia ações de não-admins é o banco (RLS).
            userState.role = perfil?.papel === 'ADMIN' ? 'ADMIN' : 'CLIENTE';
            userState.avatar = urlSegura(perfil?.avatar_url) || null;
            ativarApp();
        }

        function ativarApp() {
            // imagens da planta vêm da pasta "projeto-arquivos" do projeto configurado acima
            document.querySelectorAll('img[data-arquivo]').forEach(img => {
                img.src = `${SUPA_URL}/storage/v1/object/public/projeto-arquivos/${img.dataset.arquivo}`;
            });
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('chat-bubble').classList.remove('hidden');
            document.getElementById('user-name-top').innerText = emailCurto(userState.email);
            document.getElementById('user-role-badge').innerText = userState.role + " ACCESS";
            document.getElementById('modal-user-email').innerText = userState.email;
            const avatar = userState.avatar || `https://ui-avatars.com/api/?background=ffb7c5&color=000&name=${encodeURIComponent(emailCurto(userState.email) || 'U')}`;
            document.getElementById('user-avatar-img').src = avatar;
            document.getElementById('modal-user-img').src = avatar;
            if (userState.role === 'ADMIN') {
                document.getElementById('btn-novo-relato').classList.remove('hidden');
                document.getElementById('btn-novo-pedido').classList.remove('hidden');
                document.getElementById('btn-add-ponto').classList.remove('hidden');
            }
            iniciarMenu(); carregarDiario(); carregarPedidos(); carregarChat(); carregarCronograma(); carregarHotspots(); carregarFinanceiro(); inscreverRealtime();
        }

        // --- NAVEGAÇÃO ---
        function iniciarMenu() {
            const itens = [{ id: 'projeto3d', l: 'PROJETO' }, { id: 'financeiro', l: 'FINANCEIRO' }, { id: 'diario', l: 'DIÁRIO' }, { id: 'pedidos', l: 'MATERIAIS' }];
            document.getElementById('nav-items').innerHTML = itens.map(m => `<button onclick="switchTab('${m.id}')" class="nav-btn" id="btn-${m.id}">${m.l}</button>`).join('');
            switchTab('projeto3d');
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            const b = document.getElementById('btn-' + id);
            if (b) b.classList.add('active');
        }

        // --- RAIO X ---
        async function carregarHotspots() {
            const { data } = await sb.from('pontos_tecnicos').select('*');
            if (data) {
                cache.hotspots = data;
                document.getElementById('hotspots-container').innerHTML = data.map((p, i) => `
                    <div class="hotspot" title="${esc(p.nome_comodo)}" style="left: ${Number(p.pos_x) || 0}%; top: ${Number(p.pos_y) || 0}%" onclick="event.stopPropagation(); abrirRaioX(${i})"></div>
                `).join('');
            }
        }

        function modoAdicionarPonto() {
            alert("Clique na planta para marcar o novo ponto técnico.");
            const map = document.getElementById('map-container');
            map.onclick = (e) => {
                map.onclick = null;
                const rect = map.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                const nome = prompt("Nome do Cômodo (ex: Cozinha):");
                if (!nome) return;
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = async () => {
                    const file = input.files[0]; if (!file) return;
                    try {
                        const url = await uploadArquivo(file, 'raiox');
                        const { error } = await sb.from('pontos_tecnicos').insert([{ nome_comodo: nome, url_foto_interna: url, pos_x: x.toFixed(2), pos_y: y.toFixed(2) }]);
                        if (error) throw error;
                        carregarHotspots();
                        alert("Ponto técnico salvo com sucesso!");
                    } catch (err) { alert("Erro ao salvar ponto: " + err.message); }
                };
                input.click();
            };
        }

        function abrirRaioX(i) {
            const p = cache.hotspots[i]; if (!p) return;
            document.getElementById('raiox-titulo').innerText = p.nome_comodo || '';
            document.getElementById('raiox-img').src = urlSegura(p.url_foto_interna);
            abrirModal('modal-raiox');
        }

        function toggleLayer(layerId, checkbox) {
            const layers = ['layer-hidraulica', 'layer-eletrica', 'layer-clima'];
            layers.forEach(l => document.getElementById(l).style.opacity = "0");
            // só uma camada por vez: desmarca as outras caixas
            document.querySelectorAll('.layer-check').forEach(c => { if (c !== checkbox) c.checked = false; });
            if (checkbox.checked) {
                document.getElementById(layerId).style.opacity = "1";
                document.getElementById('planta-base').style.opacity = "0.2";
            } else { document.getElementById('planta-base').style.opacity = "1"; }
        }

        // --- CHAT ---
        function toggleChat() {
            const c = document.getElementById('chat-widget');
            c.style.display = c.style.display === 'flex' ? 'none' : 'flex';
            if (c.style.display === 'flex') { const m = document.getElementById('chat-messages'); m.scrollTop = m.scrollHeight; }
        }

        async function carregarChat() {
            const { data } = await sb.from('chat_mensagens').select('*').order('created_at', { ascending: true });
            if (data) {
                document.getElementById('chat-messages').innerHTML = '';
                data.forEach(msg => renderMsg(msg));
            }
        }

        async function enviarMensagemChat() {
            const i = document.getElementById('chat-input'); const texto = i.value.trim(); if (!texto) return;
            i.value = '';
            const { error } = await sb.from('chat_mensagens').insert([{ autor: userState.email, mensagem: texto }]);
            if (error) { i.value = texto; alert("Erro ao enviar: " + error.message); }
        }

        async function enviarFotoChat(e) {
            const file = e.target.files[0]; e.target.value = ''; if (!file) return;
            try {
                const url = await uploadArquivo(file, 'chat');
                const { error } = await sb.from('chat_mensagens').insert([{ autor: userState.email, midia_url: url }]);
                if (error) throw error;
            } catch (err) { alert("Erro ao enviar foto: " + err.message); }
        }

        function renderMsg(msg) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            const isMe = msg.autor === userState.email;
            div.className = isMe ? "self-end bg-pink-300 text-black p-3 rounded-2xl ml-auto max-w-[80%]" : "self-start bg-white/5 p-3 rounded-2xl max-w-[80%]";
            const midia = urlSegura(msg.midia_url);
            const content = midia ? `<img src="${esc(midia)}" alt="" class="rounded-lg max-w-full">` : `<p class="text-[12px] whitespace-pre-wrap break-words">${esc(msg.mensagem)}</p>`;
            div.innerHTML = `<p class="text-[9px] opacity-50 font-black mb-1">${esc(emailCurto(msg.autor))}</p>${content}`;
            container.appendChild(div); container.scrollTop = container.scrollHeight;
        }

        // --- FINANCEIRO ---
        async function carregarFinanceiro() {
            const { data } = await sb.from('obra_financeiro').select('*').order('created_at', { ascending: false });
            if (data) {
                cache.financeiro = data;
                let t = 0;
                document.getElementById('lista-financeiro-body').innerHTML = data.map(f => {
                    t += Number(f.valor_pago) || 0;
                    const anexo = urlSegura(f.cupom_url);
                    const btn = anexo ? `<button onclick='abrirAnexo(${esc(JSON.stringify(anexo))})' class="text-[9px] bg-white/5 p-2 rounded hover:bg-white/10">VER</button>` : `<span class="text-[9px] text-gray-600">—</span>`;
                    return `<tr class="border-b border-white/5"><td class="p-6 text-xs text-gray-500">${esc(dataBR(f.created_at))}</td><td class="p-6 text-xs font-bold uppercase">${esc(f.descricao)}</td><td class="p-6 text-pink-300 font-black whitespace-nowrap">${esc(moeda(f.valor_pago))}</td><td class="p-6">${btn}</td></tr>`;
                }).join('') || `<tr><td colspan="4" class="p-6 text-xs text-gray-500">Nenhum lançamento ainda.</td></tr>`;
                document.getElementById('total-financeiro').innerText = moeda(t);
            }
        }

        function gerarRelatorioFinanceiro() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("RELATÓRIO FINANCEIRO - GP OBRA", 14, 15);
            doc.autoTable({
                startY: 25, theme: 'striped',
                head: [['Data', 'Descrição', 'Valor']],
                body: cache.financeiro.map(f => [dataBR(f.created_at), f.descricao || '', moeda(f.valor_pago)]),
                headStyles: { fillColor: [255, 183, 197], textColor: [0, 0, 0] }
            });
            doc.text("TOTAL: " + document.getElementById('total-financeiro').innerText, 14, doc.lastAutoTable.finalY + 10);
            doc.save('Financeiro_Obra.pdf');
        }

        // --- CRONOGRAMA ---
        async function carregarCronograma() {
            const { data } = await sb.from('obra_cronograma').select('*').order('ordem', { ascending: true });
            if (data) {
                cache.cronograma = data;
                let soma = 0;
                const admin = userState.role === 'ADMIN';
                document.getElementById('cronograma-lista').innerHTML = data.map((item, i) => {
                    const prog = Math.max(0, Math.min(100, Number(item.progresso) || 0));
                    soma += prog;
                    return `<div ${admin ? `onclick="abrirEditorProgresso(${i})"` : ''} class="${admin ? 'cursor-pointer' : ''}">
                        <div class="flex justify-between mb-1"><span class="text-[10px] uppercase text-gray-400">${esc(item.etapa)}</span><span class="text-[10px] text-pink-300">${prog}%</span></div>
                        <div class="w-full bg-white/5 h-1 rounded-full overflow-hidden"><div class="bg-pink-300 h-full" style="width: ${prog}%"></div></div>
                    </div>`;
                }).join('');
                document.getElementById('progresso-geral-num').innerText = (data.length ? (soma / data.length).toFixed(1) : '0') + "%";
            }
        }

        function abrirEditorProgresso(i) {
            const item = cache.cronograma[i]; if (!item) return;
            document.getElementById('edit-etapa-id').value = item.id;
            document.getElementById('edit-etapa-nome').innerText = item.etapa || '';
            document.getElementById('edit-etapa-range').value = item.progresso || 0;
            document.getElementById('edit-val-display').innerText = (item.progresso || 0) + "%";
            abrirModal('modal-editar-progresso');
        }

        async function salvarNovoProgresso() {
            const id = document.getElementById('edit-etapa-id').value;
            const val = parseInt(document.getElementById('edit-etapa-range').value, 10);
            const { error } = await sb.from('obra_cronograma').update({ progresso: val }).eq('id', id);
            if (error) return alert("Erro ao salvar: " + error.message);
            fecharModal('modal-editar-progresso'); carregarCronograma();
        }

        // --- DIÁRIO ---
        async function carregarDiario() {
            const { data } = await sb.from('diario_obra').select('*').order('id', { ascending: false });
            if (data) {
                document.getElementById('feed-diario').innerHTML = data.map(item => {
                    const midia = urlSegura(item.midia_url);
                    return `<div class="card-main p-6 md:p-8 bg-white/[0.02]">
                        <p class="text-[10px] font-black text-pink-300 uppercase mb-4">${esc(emailCurto(item.autor))} • ${esc(dataBR(item.created_at))}</p>
                        <p class="text-gray-300 mb-6 text-sm whitespace-pre-wrap break-words">${esc(item.descricao)}</p>
                        ${midia ? `<img src="${esc(midia)}" alt="" class="w-full h-48 object-cover rounded-2xl">` : ''}
                    </div>`;
                }).join('') || `<p class="text-xs text-gray-500">Nenhum relato ainda.</p>`;
            }
        }

        async function salvarDiarioNoBanco() {
            const t = document.getElementById('texto-diario').value.trim(); if (!t) return alert("Escreva o relato.");
            ocupado('btn-publicar-diario', true);
            try {
                const url = arquivoDiario ? await uploadArquivo(arquivoDiario, 'diario') : null;
                const { error } = await sb.from('diario_obra').insert([{ autor: userState.email, descricao: t, midia_url: url }]);
                if (error) throw error;
                // limpa o formulário (antes a foto ficava "grudada" no próximo relato)
                document.getElementById('texto-diario').value = '';
                limparFotoDiario();
                fecharModal('modal-diario'); carregarDiario();
            } catch (err) { alert("Erro ao publicar: " + err.message); }
            finally { ocupado('btn-publicar-diario', false); }
        }

        function previewFotoDiario(e) {
            arquivoDiario = e.target.files[0] || null;
            document.getElementById('btn-foto-diario').innerText = arquivoDiario ? 'Foto anexada ✓ (trocar)' : 'Anexar Foto';
        }
        function limparFotoDiario() {
            arquivoDiario = null;
            document.getElementById('file-diario-obra').value = '';
            document.getElementById('btn-foto-diario').innerText = 'Anexar Foto';
        }

        // --- MATERIAIS ---
        async function carregarPedidos() {
            const { data } = await sb.from('pedidos_materiais').select('*').order('id', { ascending: false });
            if (data) {
                cache.pedidos = data;
                const admin = userState.role === 'ADMIN';
                document.getElementById('lista-pedidos-container').innerHTML = data.map((p, i) => `
                    <div class="card-main p-6 md:p-8 bg-white/[0.02] ${p.urgencia === 'critica' ? 'border-critica' : (p.urgencia === 'media' ? 'border-media' : 'border-planeada')}">
                        <p class="font-bold text-white uppercase text-sm break-words">${esc(p.material)}</p>
                        <p class="text-[11px] text-gray-500 uppercase font-black mb-4">Qtd: ${esc(p.quantidade)}</p>
                        <span class="text-[9px] font-black px-2 py-1 bg-white/5 text-gray-400 rounded uppercase">${esc(p.status)}</span>
                        ${admin && p.status === 'pendente' ? `
                        <div class="flex gap-2 border-t border-white/5 pt-4 mt-4">
                            <button onclick="abrirModalAprovacaoMaterial(${i})" class="flex-1 bg-green-500/10 text-green-500 text-[8px] font-black py-2 rounded uppercase hover:bg-green-500 hover:text-white transition-all">Aprovar</button>
                            <button onclick="excluirPedido(${i})" class="flex-1 bg-red-500/10 text-red-500 text-[8px] font-black py-2 rounded uppercase hover:bg-red-500 hover:text-white transition-all">Excluir</button>
                        </div>` : ''}
                    </div>`).join('') || `<p class="text-xs text-gray-500">Nenhum pedido ainda.</p>`;
            }
        }

        function gerarRelatorioMateriais() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("RELATÓRIO DE MATERIAIS - GP OBRA", 14, 15);
            const nomesUrg = { critica: 'Crítica', media: 'Média', planeada: 'Planeada' };
            doc.autoTable({
                startY: 25, theme: 'striped',
                head: [['Material', 'Quantidade', 'Urgência', 'Status']],
                body: cache.pedidos.map(p => [p.material || '', p.quantidade || '', nomesUrg[p.urgencia] || p.urgencia || '', p.status || '']),
                headStyles: { fillColor: [255, 183, 197], textColor: [0, 0, 0] }
            });
            doc.save('Materiais_Obra.pdf');
        }

        function abrirModalAprovacaoMaterial(i) {
            const p = cache.pedidos[i]; if (!p) return;
            pedidoParaAprovar = { id: p.id, material: p.material };
            document.getElementById('label-material-aprov').innerText = "Material: " + (p.material || '');
            document.getElementById('valor-material-final').value = '';
            document.getElementById('cupom-material-file').value = '';
            document.getElementById('status-cupom').classList.add('hidden');
            arquivoCupom = null;
            abrirModal('modal-finalizar-compra');
        }

        function previewCupomMaterial(e) {
            arquivoCupom = e.target.files[0] || null;
            document.getElementById('status-cupom').classList.toggle('hidden', !arquivoCupom);
        }

        async function confirmarAprovacaoComFinanceiro() {
            const valor = parseFloat(document.getElementById('valor-material-final').value);
            if (!valor || isNaN(valor) || valor <= 0 || !arquivoCupom) return alert("Informe o valor e anexe o cupom.");
            ocupado('btn-confirmar-compra', true);
            try {
                const url = await uploadArquivo(arquivoCupom, 'cupons');
                const { error: e1 } = await sb.from('obra_financeiro').insert([{ descricao: `COMPRA: ${pedidoParaAprovar.material}`, valor_pago: valor, cupom_url: url }]);
                if (e1) throw e1;
                const { error: e2 } = await sb.from('pedidos_materiais').update({ status: 'aprovado' }).eq('id', pedidoParaAprovar.id);
                if (e2) throw e2;
                fecharModal('modal-finalizar-compra');
                alert("Compra aprovada e lançada no financeiro!");
                carregarPedidos(); carregarFinanceiro();
            } catch (err) { alert("Erro ao aprovar: " + err.message); }
            finally { ocupado('btn-confirmar-compra', false); }
        }

        async function excluirPedido(i) {
            const p = cache.pedidos[i]; if (!p) return;
            if (confirm(`Deseja realmente excluir o pedido "${p.material}"?`)) {
                const { error } = await sb.from('pedidos_materiais').delete().eq('id', p.id);
                if (error) return alert("Erro ao excluir: " + error.message);
                carregarPedidos();
            }
        }

        async function enviarSolicitacaoMaterial() {
            const m = document.getElementById('mat-nome').value.trim();
            const q = document.getElementById('mat-qtd').value.trim();
            if (!m || !q) return alert("Preencha material e quantidade.");
            ocupado('btn-enviar-pedido', true);
            const { error } = await sb.from('pedidos_materiais').insert([{ material: m, quantidade: q, status: 'pendente', urgencia: urgenciaSelecionada }]);
            ocupado('btn-enviar-pedido', false);
            if (error) return alert("Erro ao enviar: " + error.message);
            document.getElementById('mat-nome').value = ''; document.getElementById('mat-qtd').value = '';
            fecharModal('modal-pedido'); carregarPedidos();
        }

        // --- UTILITÁRIOS ---
        function setUrgencia(n, btn) { urgenciaSelecionada = n; document.querySelectorAll('.urg-btn').forEach(b => b.classList.remove('urg-btn-active')); btn.classList.add('urg-btn-active'); }
        function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        async function sairSistema() { await sb.auth.signOut(); localStorage.removeItem('gp_obra_session'); location.reload(); }

        async function atualizarFotoPerfil(e) {
            const file = e.target.files[0]; e.target.value = ''; if (!file) return;
            try {
                const url = await uploadArquivo(file, 'avatars');
                const { error } = await sb.from('perfis').update({ avatar_url: url }).eq('id', userState.id);
                if (error) throw error;
                userState.avatar = url;
                document.getElementById('user-avatar-img').src = url;
                document.getElementById('modal-user-img').src = url;
            } catch (err) { alert("Erro ao trocar foto: " + err.message); }
        }

        function inscreverRealtime() {
            sb.channel('global_updates')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_mensagens' }, (p) => renderMsg(p.new))
                .on('postgres_changes', { event: '*', schema: 'public', table: 'obra_cronograma' }, () => carregarCronograma())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos_materiais' }, () => carregarPedidos())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'obra_financeiro' }, () => carregarFinanceiro())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'diario_obra' }, () => carregarDiario())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'pontos_tecnicos' }, () => carregarHotspots())
                .subscribe();
        }

        // Sessão: o Supabase guarda e renova o login sozinho
        sb.auth.onAuthStateChange((event, session) => {
            // setTimeout evita travar o cliente do Supabase dentro deste callback
            setTimeout(() => {
                if (event === 'PASSWORD_RECOVERY' && session) {
                    iniciarSessao(session.user).then(() => {
                        document.getElementById('label-seguranca').innerText = 'Defina sua nova senha abaixo';
                        abrirModal('modal-perfil');
                        document.getElementById('nova-senha-input').focus();
                    });
                } else if (event === 'SIGNED_OUT' && appIniciado) {
                    location.reload();
                }
            }, 0);
        });

        window.addEventListener('load', async () => {
            localStorage.removeItem('gp_obra_session');
            const { data: { session } } = await sb.auth.getSession();
            if (session) iniciarSessao(session.user);
        });
    </script>
</body>
</html>
